name: Reconnaissance AROME-IFS

# Lancement manuel uniquement : onglet Actions > Reconnaissance AROME-IFS > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconnaissance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-tools
          pip install -q requests

      - name: Interroger le catalogue et télécharger un exemple
        env:
          MF_TOKEN: ${{ secrets.MF_TOKEN }}
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
          MF_APP_ID: ${{ secrets.MF_APP_ID }}
          MF_CLIENT_ID: ${{ secrets.MF_CLIENT_ID }}
          MF_CLIENT_SECRET: ${{ secrets.MF_CLIENT_SECRET }}
        run: python explorer.py

      - name: Inventaire des fichiers GRIB
        if: always()
        run: |
          cd reconnaissance
          for f in *.grib2; do
            [ -f "$f" ] || continue
            echo "================ $f ================"
            echo "--- Grille (premier message) ---"
            grib_get -w count=1 -p gridType,Ni,Nj,latitudeOfFirstGridPointInDegrees,longitudeOfFirstGridPointInDegrees,latitudeOfLastGridPointInDegrees,longitudeOfLastGridPointInDegrees,iDirectionIncrementInDegrees,jDirectionIncrementInDegrees,packingType,bitsPerValue "$f"
            echo "--- Paramètres présents (nombre de messages) ---"
            grib_get -p shortName,name,units,typeOfLevel,level,stepType,discipline,parameterCategory,parameterNumber "$f" | sort | uniq -c
            echo "--- Échéances ---"
            grib_get -p stepRange "$f" | sort -n | uniq | tr '\n' ' '; echo
            echo "--- Exemple de valeurs (premier message) ---"
            grib_ls -w count=1 -n statistics "$f"
          done | tee inventaire.txt

      - name: Conserver le résultat (sans les gros fichiers GRIB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconnaissance
          path: |
            reconnaissance/catalogue.json
            reconnaissance/inventaire.txt
          retention-days: 7
