name: Reconnaissance

# Lancement manuel : onglet Actions > Reconnaissance > Run workflow
on:
  workflow_dispatch:
    inputs:
      modeles:
        description: "Modèles à inventorier, séparés par des virgules (vide = tous). Ex. arpege,mfwam,ww3_atl"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  reconnaissance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-tools netcdf-bin
          pip install -q requests

      - name: Interroger les catalogues et télécharger des exemples
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
          MF_CLIENT_ID: ${{ secrets.MF_CLIENT_ID }}
          MF_CLIENT_SECRET: ${{ secrets.MF_CLIENT_SECRET }}
          MF_APP_ID: ${{ secrets.MF_APP_ID }}
          MF_TOKEN: ${{ secrets.MF_TOKEN }}
          MODELES: ${{ inputs.modeles }}
        run: python reconnaissance.py

      - name: Inventaire des exemples
        if: always()
        run: |
          mkdir -p reconnaissance && cd reconnaissance
          {
          for f in *.grib2; do
            [ -f "$f" ] || continue
            echo "================ $f ($(du -h "$f" | cut -f1)) ================"
            echo "--- Grille (premier message) ---"
            grib_get -w count=1 -p gridType,Ni,Nj,latitudeOfFirstGridPointInDegrees,longitudeOfFirstGridPointInDegrees,latitudeOfLastGridPointInDegrees,longitudeOfLastGridPointInDegrees,iDirectionIncrementInDegrees,jDirectionIncrementInDegrees,packingType,bitsPerValue "$f"
            echo "--- Paramètres (nombre de messages) ---"
            grib_get -p shortName,name,units,typeOfLevel,level,stepType,discipline,parameterCategory,parameterNumber "$f" | sort | uniq -c
            echo "--- Échéances ---"
            grib_get -p stepRange "$f" | sort -n | uniq | tr '\n' ' '; echo
          done
          for f in *.nc; do
            [ -f "$f" ] || continue
            echo "================ $f ($(du -h "$f" | cut -f1)) ================"
            ncdump -h "$f" | head -n 200
          done
          } | tee inventaire.txt

      - name: Conserver le résultat (sans les gros fichiers)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reconnaissance
          path: |
            reconnaissance/catalogue.json
            reconnaissance/inventaire.txt
          if-no-files-found: ignore
          retention-days: 7
