name: Modèles

on:
  # Toutes les heures (UTC, minute 17) : vérification rapide, conversion seulement des modèles qui ont un nouveau run.
  schedule:
    - cron: "17 * * * *"
  # Modification de l'appli ou des zones : republication du site sans reconversion.
  push:
    branches: [main]
    paths: ["app/**", "zones.json"]
  workflow_dispatch:
    inputs:
      modeles:
        description: "Modèles à traiter, séparés par des virgules (vide = tous les modèles actifs). Ex. arome,mfwam_fr"
        required: false
        default: ""
      forcer:
        description: "Refaire la conversion même si le dernier run est déjà publié"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Deux files séparées : les republications de l'appli (push) n'annulent plus les mises à jour horaires en attente.
concurrency:
  group: modeles-${{ github.event_name == 'push' && 'appli' || 'donnees' }}
  cancel-in-progress: false

env:
  MF_API_KEY: ${{ secrets.MF_API_KEY }}
  MF_CLIENT_ID: ${{ secrets.MF_CLIENT_ID }}
  MF_CLIENT_SECRET: ${{ secrets.MF_CLIENT_SECRET }}
  MF_APP_ID: ${{ secrets.MF_APP_ID }}
  MF_TOKEN: ${{ secrets.MF_TOKEN }}
  # courants Copernicus Marine (compte gratuit, secrets du dépôt)
  COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.CMEMS_USER }}
  COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.CMEMS_PASS }}

jobs:
  # ---- 1. Quels modèles ont un nouveau run ? (quelques secondes)
  verifier:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    outputs:
      liste: ${{ steps.v.outputs.liste }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - id: v
        env:
          MODELES: ${{ inputs.modeles }}
          FORCER: ${{ inputs.forcer }}
        run: python verifier.py

  # ---- 2. Une conversion par modèle, en parallèle
  convertir:
    needs: verifier
    if: needs.verifier.outputs.liste != '[]' && needs.verifier.outputs.liste != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.verifier.outputs.liste) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer ecCodes et les bibliothèques
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
          pip install -q eccodes numpy requests netCDF4
          case "${{ matrix.modele }}" in courant_*) pip install -q copernicusmarine ;; esac
      - name: Télécharger et convertir ${{ matrix.modele }}
        id: conv
        run: python convertir.py --modele "${{ matrix.modele }}" --sortie publie --deja "${{ matrix.deja }}"
      - name: Transmettre le résultat à la publication
        if: steps.conv.outputs.nouveau == 'oui'
        uses: actions/upload-artifact@v5
        with:
          name: sortie-${{ matrix.modele }}
          path: publie/
          retention-days: 1

  # ---- 3. Publication : Release « dernier » (stockage des modèles) + site GitHub Pages (appli + tuiles)
  publier:
    needs: [verifier, convertir]
    if: always() && (github.event_name == 'push' || needs.convertir.result == 'success' || needs.convertir.result == 'failure')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Récupérer les conversions
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: sortie-*
          path: artefacts
      - name: Récupérer les modèles déjà publiés (Release « dernier »)
        run: |
          mkdir -p site anciens artefacts
          gh release view dernier >/dev/null 2>&1 || \
            gh release create dernier --title "Derniers runs" --notes "Mis à jour automatiquement. Données Météo-France (licence Etalab)."
          gh release download dernier -p "*.zip" -D anciens --clobber || true
          for z in anciens/*.zip; do [ -e "$z" ] && unzip -qo "$z" -d site; done
          ls site
      - name: Assembler le site
        id: pub
        run: python publier.py --site site --artefacts artefacts --app app/index.html --zones zones.json
      - name: Ranger les nouveaux runs dans la Release
        if: steps.pub.outputs.maj != ''
        run: |
          cd site
          for m in ${{ steps.pub.outputs.maj }}; do
            rm -f "../$m.zip"
            zip -qr "../$m.zip" "$m"
            gh release upload dernier "../$m.zip" --clobber
          done
      - name: Préparer le site
        if: steps.pub.outputs.maj != '' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publier sur GitHub Pages
        id: deploy
        if: steps.pub.outputs.maj != '' || github.event_name == 'push'
        uses: actions/deploy-pages@v4
